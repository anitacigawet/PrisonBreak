<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta
      name="description"
      content="A self-hosted, source-grounded workspace for reading criminal case records and preparing questions for attorney review."
    />
    <meta property="og:title" content="PrisonBreak — source-grounded case reading" />
    <meta
      property="og:description"
      content="Compare grounded readings of a case record and prepare a concise handoff for a licensed attorney."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>PrisonBreak — Source-Grounded Case Reading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Paper theme typography stack:
        Caveat       — display + hand-drawn labels (headers, growing pill, "Take to trial.")
        Kalam        — secondary hand-drawn for body annotations
        Newsreader   — long-form prose (case summaries, notes, analysis body)
        JetBrains Mono — kept for case numbers, IDs, technical readouts
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!--
      Theme-init script — runs synchronously before React hydrates so the
      .dark class is on <html> by the time the first paint happens. Without
      this, a user with dark-mode persisted in localStorage would see a
      cream flash before JS swaps the class.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("pb-theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored || (prefersDark ? "dark" : "light");
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (_) {
          /* ignore — localStorage / matchMedia may be unavailable */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
